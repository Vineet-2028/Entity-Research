name: CPU research regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-research.txt
      - run: python -m pip check
      - run: python -m unittest discover -s research_tests -v
      - run: python examples/synthetic_matcher.py --output results/synthetic_cpu.json
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-cpu-results
          path: results/synthetic_cpu.json
